worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Зона кешу для proxy_cache (Пункт 9)
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Rate limiting зони (Пункт 10)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream для флоту Node.js реплік (Least Connections - Пункт 6)
    upstream node_backend {
        least_conn;
        server node-app-1:3000 max_fails=3 fail_timeout=30s;
        server node-app-2:3000 max_fails=3 fail_timeout=30s;
        server node-app-3:3000 max_fails=3 fail_timeout=30s;
    }

    # Upstream для WebSocket з закріпленням сесії (IP Hash - Пункт 8)
    upstream ws_backend {
        ip_hash;
        server node-app-1:3000;
        server node-app-2:3000;
        server node-app-3:3000;
    }

    # Редирект усього HTTP на HTTPS (SSL Termination - Пункт 11)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Загальні ліміти
        limit_conn conn_limit 20;

        # API роути до Node.js флотy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://node_backend;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 30s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Жорсткіший ліміт для логіну (захист від брутфорсу)
        location /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://node_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket проксіювання (Пункт 8)
        location /ws {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Роздача статики безпосередньо Nginx (Пункт 9)
        location /static/ {
            root /var/www/app;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}